services:
  - type: web
    name: campanha-viva
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false        # colar no painel do Render manualmente (mais seguro)
      - key: SESSION_SECRET
        sync: false        # colar no painel — pode ser qualquer frase longa
